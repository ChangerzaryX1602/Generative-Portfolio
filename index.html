<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

        :root {
            --primary-color: #2c3e50;
            --accent-color: #2980b9;
            --text-color: #333;
            --bg-color: #fff;
            --section-gap: 10px;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f2f5;
            color: var(--text-color);
            line-height: 1.3;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .resume-wrapper {
            width: 210mm;
            height: 297mm;
            overflow: hidden;
            background-color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .resume-container {
            background-color: var(--bg-color);
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .profile-photo {
            width: 90px;
            height: 112px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        .personal-details {
            font-size: 11px;
            color: #555;
            margin-top: 3px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
        }

        h2 {
            font-size: 14px;
            color: var(--primary-color);
            text-transform: uppercase;
            border-bottom: 1px solid #ddd;
            padding-bottom: 2px;
            margin-top: 0;
            margin-bottom: 8px;
        }

        section {
            margin-bottom: var(--section-gap);
        }

        p {
            margin: 0 0 5px 0;
            font-size: 12px;
            text-align: justify;
        }

        .job-item {
            margin-bottom: 8px;
            page-break-inside: avoid;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1px;
        }

        .job-title {
            font-weight: 700;
            font-size: 13px;
        }

        .company-name {
            font-style: italic;
            color: #444;
        }

        .job-date {
            font-size: 11px;
            color: #666;
            text-align: right;
            min-width: 140px;
        }

        ul {
            margin: 1px 0 3px 15px;
            padding: 0;
        }

        li {
            font-size: 12px;
            margin-bottom: 1px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 5px;
            font-size: 12px;
            margin-bottom: 2px;
        }
        
        .skill-label {
            font-weight: bold;
            color: var(--primary-color);
        }

        .award-item {
            margin-bottom: 6px;
            font-size: 14px;
        }

        @media print {
            body { background: none; padding: 0; }
            .resume-wrapper { box-shadow: none; }
            .resume-container { box-shadow: none; padding: 15px; }
        }

        @page {
            size: A4;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="resume-wrapper">
    <div class="resume-container" id="resume">
        <!-- Content will be loaded from config.json -->
    </div>
    </div>

    <script>
        // Function for puppeteer to call with injected data
        function loadResumeWithData(data) {
            renderResume(data);
        }

        async function loadResume() {
            try {
                const response = await fetch('config.json');
                const data = await response.json();
                renderResume(data);
            } catch (e) {
                // If fetch fails (file:// protocol), wait for puppeteer to inject data
                console.log('Waiting for data injection...');
            }
        }

        function renderResume(data) {
            const container = document.getElementById('resume');
            
            // Header
            let html = `
                <header>
                    <div class="header-text">
                        <h1>${data.personal.name}</h1>
                        <div class="personal-details">
                            <div class="contact-line">
                                ${data.personal.email} | ${data.personal.phone} | ${data.personal.location}
                            </div>
                            <div><strong>Date of Birth:</strong> ${data.personal.dateOfBirth}</div>
                            <div><strong>Nationality:</strong> ${data.personal.nationality}</div>
                            <div style="grid-column: 1 / -1; margin-top: 5px;">
                                <strong>Address:</strong> ${data.personal.address}
                            </div>
                        </div>
                    </div>
                    <img src="${data.personal.photo}" alt="${data.personal.name}" class="profile-photo">
                </header>
            `;
            
            // Objective
            html += `
                <section>
                    <h2>Objective</h2>
                    <p>${data.objective}</p>
                </section>
            `;
            
            // Skills
            html += `<section><h2>Skills</h2>`;
            for (const [label, skills] of Object.entries(data.skills)) {
                html += `
                    <div class="skills-grid">
                        <div class="skill-label">${label}:</div>
                        <div>${skills}</div>
                    </div>
                `;
            }
            html += `</section>`;
            
            // Experience
            html += `<section><h2>Experience</h2>`;
            for (const job of data.experience) {
                html += `
                    <div class="job-item">
                        <div class="job-header">
                            <span class="job-title">${job.title} <span class="company-name">| ${job.company}</span></span>
                            <span class="job-date">${job.date}</span>
                        </div>
                        <ul>
                            ${job.responsibilities.map(r => `<li>${r}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            html += `</section>`;
            
            // Awards
            html += `<section><h2>Honors & Awards</h2>`;
            for (const award of data.awards) {
                if (award.description) {
                    html += `<div class="award-item"><strong>${award.title}:<br></strong> ${award.description}</div>`;
                } else {
                    html += `<div class="award-item"><strong>${award.title}</strong></div>`;
                }
            }
            html += `</section>`;
            
            // Education
            html += `
                <section>
                    <h2>Education</h2>
                    <div class="job-header">
                        <span class="job-title">${data.education.degree}</span>
                        <span class="job-date">${data.education.date}</span>
                    </div>
                    <div class="job-title">${data.education.institution}</div>
                    <div style="font-size: 12px; color: #777; margin-top: 2px;">
                        ${data.education.address}
                    </div>
                </section>
            `;
            
            container.innerHTML = html;
            
            // Update title
            document.title = `Resume - ${data.personal.name}`;
            
            // Fit to page
            fitToPage();
        }
        
        function fitToPage() {
            const container = document.querySelector('.resume-container');
            container.style.zoom = '1';
            
            const a4Height = 297 * 3.7795;
            const contentHeight = container.scrollHeight;
            
            if (contentHeight > a4Height) {
                const scale = a4Height / contentHeight;
                container.style.zoom = Math.max(scale, 0.7);
            }
        }
        
        window.addEventListener('load', loadResume);
        window.addEventListener('resize', fitToPage);
        window.addEventListener('beforeprint', fitToPage);
    </script>
</body>
</html>
